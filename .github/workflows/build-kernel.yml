name: Build Xiaomi SM8150 Kernel (raphael / K20 Pro, MIUI)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Xiaomi SM8150 kernel (with MIUI drivers)
        uses: actions/checkout@v4
        with:
          repository: qaz6750/android_kernel_xiaomi_sm8150
          ref: a14-xiaomi-4.14.y
          path: kernel

      - name: Setup AOSP Clang 22.0.0 (r522817)
        run: |
          mkdir -p clang
          cd clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          if [ $? -ne 0 ]; then
            echo "GoogleSource failed, trying mirror..."
            wget -q https://github.com/7felix7/android_prebuilts_clang_host_linux-x86_clang-r522817/archive/refs/heads/main.tar.gz -O clang-r522817.tar.gz
          fi
          tar xf clang-r522817.tar.gz
          rm -f clang-r522817.tar.gz
          echo "Clang version:"
          ./bin/clang --version

      - name: Install cross-compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Build kernel
        run: |
          cd kernel

          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          echo "=== Step 1: make raphael_defconfig ==="
          echo "Using the kernel's built-in raphael (K20 Pro) MIUI defconfig"
          make O=out ARCH=arm64 raphael_defconfig 2>&1 | tail -20

          echo ""
          echo "=== Step 2: make olddefconfig ==="
          make O=out ARCH=arm64 olddefconfig 2>&1 | tail -20

          echo ""
          echo "=== Step 3: Verify key MIUI/HyperOS options ==="
          for opt in MACH_XIAOMI MACH_XIAOMI_SM8150 MACH_XIAOMI_RAPHAEL MACH_XIAOMI_CEPHEUS TOUCHSCREEN_XIAOMI_TOUCHFEATURE TOUCHSCREEN_GOODIX_GTX8 FINGERPRINT_GOODIX_TA NFC_NQ; do
            val=$(grep "CONFIG_${opt}=" out/.config || echo "NOT SET")
            echo "  CONFIG_${opt}: ${val}"
          done

          echo ""
          echo "=== Step 4: make kernel ==="
          # Clang 22 treats designated-init warnings as errors; Xiaomi's rdbg.c needs this relaxed
          make O=out ARCH=arm64 -j$(nproc) KCFLAGS="-Wno-error=designated-init" 2>&1 | tee build.log

          echo ""
          echo "=== Build result ==="
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "✓ Image built successfully"
            ls -lh out/arch/arm64/boot/Image*
          else
            echo "✗ Image not found, checking for errors..."
            tail -80 build.log
            exit 1
          fi

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-raphael-miui
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dts/qcom/*.dtb
            kernel/out/arch/arm64/boot/dtbo.img
            kernel/out/**/*.ko
            kernel/build.log
            kernel/out/.config