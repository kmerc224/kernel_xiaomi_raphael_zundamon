name: Build Zundamon raphael kernel (oss-base + clang 22)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Zundamon kernel (oss-base = official source of working 4.14.357)
        uses: actions/checkout@v4
        with:
          repository: HeliumStudio-Dev/kernel_xiaomi_raphael
          ref: oss-base
          path: kernel

      - name: Install build deps + p7zip
        run: |
          sudo apt-get update >/dev/null 2>&1 || true
          sudo apt-get install -y -o Acquire::Retries=3 bc flex bison libssl-dev libelf-dev libyaml-dev p7zip-full >/dev/null 2>&1
          echo "deps ok"

      - name: Download Mandi-Sa clang 22 toolchain
        timeout-minutes: 10
        run: |
          cd /tmp
          curl -sSL --retry 3 -o tc.7z "https://github.com/Mandi-Sa/clang/releases/download/amd64-kernel-arm_static-22/llvm22.0.0-binutils2.45.1_amd64-kernel-arm_static-20260111.7z"
          ls -lh tc.7z
          7z x -y tc.7z -o/tmp/tc >/dev/null
          # The toolchain ships a bare host `ld`/`ld.bfd`/`ld.lld` in bin/ that
          # does not include Debian multilib paths (/usr/lib/x86_64-linux-gnu),
          # so it shadows the system linker and breaks host dtc/yamltree linking
          # (-lyaml -> "undefined reference to yaml_*"). Delete ONLY the bare
          # host linkers; KEEP aarch64-linux-gnu-ld (cross) + clang + clang-22.
          rm -f /tmp/tc/bin/ld /tmp/tc/bin/ld.bfd /tmp/tc/bin/ld.lld /tmp/tc/bin/ld64.lld
          ls -l /tmp/tc/bin/aarch64-linux-gnu-ld /tmp/tc/bin/clang-22 2>/dev/null || true
          /tmp/tc/bin/clang --version | head -1

      - name: Build Image.gz-dtb (official raphael_defconfig, clang 22)
        run: |
          cd kernel
          # Bare host `ld` was removed from /tmp/tc/bin above, so it is now SAFE
          # to put /tmp/tc/bin back on PATH: host tools (scripts/dtc) use the
          # system gcc -> system /usr/bin/ld, while the kernel links via
          # aarch64-linux-gnu-ld (cross, still in /tmp/tc/bin).
          export PATH=/tmp/tc/bin:/tmp/tc/aarch64-linux-gnu/bin:/tmp/tc/arm-linux-gnueabi/bin:$PATH
          export ARCH=arm64
          echo "=== Makefile version check (must be 4.14.356+, NOT the old 4.14.336) ==="
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)" Makefile
          KVER=$(awk '/^SUBLEVEL/{print $3; exit}' Makefile)
          if [ -z "$KVER" ] || [ "$KVER" -lt 356 ]; then echo "ERROR: SUBLEVEL=$KVER too old"; exit 1; fi
          echo "makefile_version_ok SUBLEVEL=$KVER"
          # CC=clang on the command line only (kernel Makefile assigns
          # "CC = $(CROSS_COMPILE)gcc" which overrides an exported CC).
          # Host tools (scripts/dtc, kconfig) must use the DEFAULT host gcc
          # (do NOT set HOSTCC=clang or LD=ld.lld -- that broke dtc/yamltree
          # linking against libyaml). Kernel itself links via CLANG_TRIPLE
          # -> aarch64-linux-gnu-ld (binutils present in Mandi-Sa toolchain).
          MAKEVARS="CC=/tmp/tc/bin/clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- HOSTCC=gcc"

          echo "=== verify toolchain ==="
          /tmp/tc/bin/clang --version | head -1
          aarch64-linux-gnu-ld --version | head -1
          gcc --version | head -1
          which ld

          echo "=== raphael_defconfig ==="
          make O=out ARCH=arm64 $MAKEVARS raphael_defconfig 2>&1 | tail -15

          echo "=== verify boot-critical options ==="
          for opt in ARCH_SM8150 MACH_XIAOMI_RAPHAEL MACH_XIAOMI_SM8150 TI_DRV8846 TOUCHSCREEN_GOODIX_GTX8 FINGERPRINT_GOODIX_TA FPR_FPC BUILD_ARM64_APPENDED_DTB_IMAGE BUILD_ARM64_DT_OVERLAY LOCALVERSION; do
            grep "CONFIG_${opt}=" out/.config | sed 's/^/  /'
          done

          echo "=== build Image.gz-dtb ==="
          if ! make O=out ARCH=arm64 $MAKEVARS -j$(nproc) Image.gz-dtb KCFLAGS="-Wno-error" > build.log 2>&1; then
            echo "=== BUILD FAILED - error lines ==="
            grep -n -E "error:|Error [0-9]+|undefined reference|No rule to make|fatal error|No such file" build.log | tail -80 || true
            tail -80 build.log
            exit 1
          fi
          echo "=== build done ==="
          tail -15 build.log

          echo "=== verify built kernel version (must be >= 4.14.356, NOT 4.14.336) ==="
          gzip -dc out/arch/arm64/boot/Image.gz-dtb 2>/dev/null | strings | grep -m1 "Linux version" > /tmp/kver.txt || true
          cat /tmp/kver.txt
          grep -qE "4\.14\.[3-9][5-9][0-9]" /tmp/kver.txt || { echo "ERROR: built kernel version too old"; exit 1; }
          echo "  version_check_ok"

          echo "=== dtb/dtbo files built ==="
          ls -lh out/arch/arm64/boot/dts/qcom/*.dtb 2>/dev/null | sed 's/^/  /' || true
          ls -lh out/arch/arm64/boot/dts/qcom/*.dtbo 2>/dev/null | sed 's/^/  /' || true

          echo "=== verify appended dtb is NOT rumi ==="
          python3 -c "d=open('out/arch/arm64/boot/Image.gz-dtb','rb').read(); i=d.rfind(b'\xd0\x0d\xfe\xed'); print('  FDT_offset', i, 'of', len(d))"
          strings out/arch/arm64/boot/Image.gz-dtb 2>/dev/null | grep -iE "rumi|sm8150-v2|sm8150 v2|mtp|raphael|xiaomi" | sort -u | head -30 || echo "  (no board strings found)"

          echo "=== result ==="
          ls -lh out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image.gz-dtb 2>/dev/null | sed 's/^/  /' || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zundamon-oss-base-clang22
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dts/qcom/*.dtb
            kernel/out/arch/arm64/boot/dts/qcom/*.dtbo
            kernel/build.log
            kernel/out/.config