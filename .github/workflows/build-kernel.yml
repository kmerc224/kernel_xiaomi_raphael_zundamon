name: Build Xiaomi SM8150 Kernel (raphael / K20 Pro, MIUI)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Xiaomi SM8150 kernel (with MIUI drivers)
        uses: actions/checkout@v4
        with:
          repository: qaz6750/android_kernel_xiaomi_sm8150
          ref: a14-xiaomi-4.14.y
          path: kernel

      - name: Patch qcacld-3.0 enum-int-mismatch (Clang 22)
        run: |
          cd kernel
          F=drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_cfg80211.c
          # make definition match the header declaration (uint32_t reason)
          sed -i 's/enum qdf_hang_reason reason, uint8_t \*data,/uint32_t reason, uint8_t *data,/' "$F"
          sed -i 's/hang_reason = hdd_convert_hang_reason(reason);/hang_reason = hdd_convert_hang_reason((enum qdf_hang_reason)reason);/' "$F"
          echo "=== patched signature ==="
          grep -n "wlan_hdd_send_hang_reason_event\|hdd_convert_hang_reason(reason)" "$F" | head
          # drop -Werror from qcacld Kbuild so Clang 22 warnings are non-fatal
          sed -i '/^[[:space:]]*-Werror\\$/d' drivers/staging/qcacld-3.0/Kbuild
          echo "=== qcacld cppflags after patch ==="
          grep -n -A5 "ANI_OS_TYPE_ANDROID" drivers/staging/qcacld-3.0/Kbuild | head

      - name: Setup AOSP Clang 22.0.0 (r522817)
        run: |
          mkdir -p clang
          cd clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          if [ $? -ne 0 ]; then
            echo "GoogleSource failed, trying mirror..."
            wget -q https://github.com/7felix7/android_prebuilts_clang_host_linux-x86_clang-r522817/archive/refs/heads/main.tar.gz -O clang-r522817.tar.gz
          fi
          tar xf clang-r522817.tar.gz
          rm -f clang-r522817.tar.gz
          echo "Clang version:"
          ./bin/clang --version

      - name: Install cross-compilers
        timeout-minutes: 20
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # skip apt-get update (runner image already has fresh package lists)
          sudo apt-get install -y -o Acquire::Retries=5 -o Acquire::http::Timeout=120 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi 2>&1 | tail -8
          echo "aarch64-linux-gnu-gcc:"
          aarch64-linux-gnu-gcc --version | head -1 || echo "MISSING aarch64 gcc"
          echo "arm-linux-gnueabi-gcc:"
          arm-linux-gnueabi-gcc --version | head -1 || echo "MISSING arm gcc"

      - name: Build kernel
        run: |
          cd kernel

          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          echo "=== Step 1: make raphael_stock_defconfig ==="
          echo "Use the FULL 6155-line raphael stock defconfig (identical to the"
          echo "working Zundamon/HyperOS3 port kernel). NOT the 741-line raphael_defconfig,"
          echo "which enables MACH_XIAOMI_* MIUI hooks incompatible with the AOSP port."
          make O=out ARCH=arm64 raphael_stock_defconfig 2>&1 | tail -20

          echo ""
          echo "=== Step 2: make olddefconfig ==="
          make O=out ARCH=arm64 olddefconfig 2>&1 | tail -20

          echo ""
          echo "=== Step 3: Verify key boot-critical options (standard SM8150 path) ==="
          for opt in BUILD_ARM64_DT_OVERLAY TI_DRV8846 DRM_MSM_DSI_STAGING QCOM_KGSL DM_VERITY DM_VERITY_AVB BPF_SYSCALL; do
            val=$(grep "CONFIG_${opt}=" out/.config || echo "NOT SET")
            echo "  CONFIG_${opt}: ${val}"
          done
          echo "  (MACH_XIAOMI_* should be NOT SET here - that is expected and correct)"
          grep -E "CONFIG_MACH_XIAOMI" out/.config || echo "  MACH_XIAOMI_*: NOT SET (good)"

          echo ""
          echo "=== Step 4: Build device trees (dtb + dtbo) ==="
          make O=out ARCH=arm64 -j$(nproc) dtbs KCFLAGS="-Wno-error=designated-init -Wno-error=format" 2>&1 | tail -15

          echo ""
          echo "=== Step 5: Build Image.gz-dtb (kernel + base dtb, no dtbo) ==="
          echo "(stock config has BUILD_ARM64_DT_OVERLAY off, so dtbo.img is NOT a target;"
          echo " raphael device tree comes from the port ROM's boot/dtbo, not the kernel)"
          if ! make O=out ARCH=arm64 -j$(nproc) Image.gz-dtb KCFLAGS="-Wno-error=designated-init -Wno-error=format -Wno-error=enum-int-mismatch" > build.log 2>&1; then
            echo "=== BUILD FAILED - error lines ==="
            grep -n -E "error:|Error [0-9]+|undefined reference|No rule to make|fatal error|cannot find|No such file|collect2|ld:" build.log | tail -100 || true
            echo ""
            echo "=== BUILD FAILED - context around first error ==="
            LINE=$(grep -nE "Error [0-9]+|error:" build.log | head -1 | cut -d: -f1)
            if [ -n "$LINE" ]; then
              START=$((LINE-60)); [ $START -lt 1 ] && START=1
              sed -n "${START},$((LINE+8))p" build.log
            else
              tail -150 build.log
            fi
            exit 1
          fi
          tail -20 build.log

          echo ""
          echo "=== Build result ==="
          ls -lh out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image.gz-dtb 2>/dev/null || true
          echo ""
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "✓ Image.gz-dtb built (kernel + device tree)"
          else
            echo "✗ Image.gz-dtb not found!"
            exit 1
          fi
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            echo "✓ dtbo.img built (device tree overlay)"
          else
            echo "⚠ dtbo.img not built (overlay for raphael)"
          fi

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-raphael-miui
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dts/qcom/*.dtb
            kernel/out/**/*.ko
            kernel/build.log
            kernel/out/.config